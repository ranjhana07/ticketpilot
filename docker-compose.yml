services:
  helpdesk:
    build: .
    command: ["ticketpilot", "helpdesk", "--host", "0.0.0.0", "--port", "8001", "--reset"]
    ports:
      - "8001:8001"
    volumes:
      - helpdesk-data:/app/data

  inbox:
    build: .
    command: ["ticketpilot", "serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      HELPDESK_URL: http://helpdesk:8001
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - hf-cache:/root/.cache/huggingface
    depends_on:
      - helpdesk

volumes:
  helpdesk-data:
  hf-cache:
